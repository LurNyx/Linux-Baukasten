name: ISO bauen (echter Test)

# Baut aus einer Vorlage wirklich eine ISO (live-build in Docker, Debian 13) - der Ende-zu-Ende-Beweis für den Generator.
# Start: Reiter "Actions" -> "ISO bauen (echter Test)" -> "Run workflow". Die ISO gibt es danach als Artefakt (3 Tage).

on:
  workflow_dispatch:
    inputs:
      preset:
        description: "Vorlage (server, rescue, tails-like, kali-like, daily, developer, gaming, minimal-desktop) oder Pfad einer Rezept-Datei"
        default: "server"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Artefakt-Name (Pfad/Schrägstriche sind im Namen nicht erlaubt)
        id: n
        run: echo "name=$(basename "${{ inputs.preset }}" .baukasten.json)" >> "$GITHUB_OUTPUT"
      - name: Projekt aus der Vorlage erzeugen
        run: python Linux-Baukasten.pyw --export "${{ inputs.preset }}" --out "$RUNNER_TEMP/proj"
      - name: Platz schaffen
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h /
      - name: ISO bauen (Docker, Debian 13 trixie)
        run: |
          docker run --rm --privileged -v "$RUNNER_TEMP/proj:/work" debian:trixie sh -c '
            cp -a /work /build && cd /build
            rc=0
            sh ./build.sh || rc=$?
            cp -v /build/build.log /work/ || true
            cp -v /build/*.iso /work/ || true
            exit $rc'
      - name: Bootmenü in der fertigen ISO prüfen
        run: |
          sudo apt-get install -y p7zip-full >/dev/null
          iso=$(ls "$RUNNER_TEMP"/proj/*.iso | head -n1)
          python - "$iso" "$RUNNER_TEMP/proj/REZEPT.json" <<'PY'
          import json, subprocess, sys
          iso, recipe = sys.argv[1], json.load(open(sys.argv[2], encoding="utf-8"))
          def extract(path):
              return subprocess.run(["7z", "e", "-so", iso, path], capture_output=True, text=True).stdout
          grub, iso_cfg, grubcfg = extract("boot/grub/config.cfg"), extract("isolinux/isolinux.cfg"), extract("boot/grub/grub.cfg")
          t = recipe["boot_timeout"]
          print("== boot/grub/config.cfg (Anfang)\n" + "\n".join(grub.splitlines()[:4]))
          print("== isolinux/isolinux.cfg\n" + iso_cfg)
          entry = [l for l in grubcfg.splitlines() if l.strip().startswith("linux")][:1]
          print("== erster Menüeintrag (grub.cfg)\n" + "\n".join(entry))
          if t:
              assert f"set timeout={t}" in grub, "GRUB-Wartezeit fehlt in der ISO"
              assert f"timeout {t * 10}" in iso_cfg, "isolinux-Wartezeit fehlt in der ISO"
          for p in ("amnesic",) if "amnesic-full" in recipe["features"] else ():
              assert any(p in l.split() for l in entry), "amnesic fehlt im Menüeintrag"
          for p in recipe["extra_boot_params"]:
              assert any(p in l.split() for l in entry), f"{p} fehlt im Menüeintrag"
          print("Bootmenü OK")
          PY
      - name: Ergebnis
        if: always()
        run: |
          sudo chown -R "$USER" "$RUNNER_TEMP/proj" || true
          ls -lh "$RUNNER_TEMP/proj"/*.iso "$RUNNER_TEMP/proj/build.log" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iso-${{ steps.n.outputs.name }}
          path: |
            ${{ runner.temp }}/proj/*.iso
            ${{ runner.temp }}/proj/build.log
          retention-days: 3
